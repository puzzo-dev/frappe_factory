"70" fill="#B5D4F4"/><rect x="230" y="205" width="60" height="90" rx="4" fill="none" stroke="#888780" stroke-width="1.5"/><text x="260" y="262" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">78%</text><text x="260" y="312" text-anchor="middle" font-size="12" fill="#5F5E5A">Treated tank</text><rect x="40" y="220" width="140" height="60" rx="4" fill="none" stroke="#888780" stroke-width="1.5"/><g fill="#888780"><circle cx="52" cy="240" r="4"/><circle cx="64" cy="240" r="4"/><circle cx="76" cy="240" r="4"/><circle cx="88" cy="240" r="4"/><circle cx="100" cy="240" r="4"/><circle cx="112" cy="240" r="4"/><circle cx="124" cy="240" r="4"/><circle cx="136" cy="240" r="4"/><circle cx="160" cy="240" r="4"/></g><circle cx="148" cy="240" r="4" fill="none" stroke="#888780" stroke-width="1.5"/><text x="110" y="266" text-anchor="middle" font-size="12" fill="#5F5E5A">9 of 10 heads</text><text x="110" y="300" text-anchor="middle" font-size="12" fill="#5F5E5A">Koyo filler · running</text><text x="110" y="317" text-anchor="middle" font-size="14" fill="#2C2C2A">2,140 bags/h</text><text x="318" y="338" text-anchor="middle" font-size="12" fill="#5F5E5A">Re-purify return · valve closed</text><text x="24" y="376" font-size="12" fill="#5F5E5A">Generator running · 48 kW</text><text x="250" y="376" font-size="12" fill="#5F5E5A">Diesel 41% · about 9 h left</text><text x="470" y="376" font-size="12" fill="#5F5E5A">Water in 4.1 m³/h</text></svg>
