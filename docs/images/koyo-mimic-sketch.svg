<svg viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, Segoe UI, Arial, sans-serif"><title>Koyo water plant process mimic sketch</title><desc>Borehole pump, raw tank, sand and carbon filters, RO skid, remineralization, lead analyser with interlock, divert valve, UV, treated tank and the 10-head Koyo filler, with a closed re-purify return line and one active alarm on the carbon filter.</desc><rect width="680" height="390" fill="#ffffff"/><g fill="none" stroke="#888780" stroke-width="3"><path d="M66 90H95 M155 90H195 M235 90H275 M315 90H355 M475 90H600V225 M560 250H498 M462 250H440 M420 250H400 M340 250H290 M230 250H180"/></g><g fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5"><path d="M430 262V345H205V175H140V135"/></g><g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.9"><path d="M66 90H95 M155 90H195 M235 90H275 M315 90H355 M475 90H600V225 M560 250H498 M462 250H440 M420 250H400 M340 250H290 M230 250H180"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path></g><circle cx="50" cy="90" r="16" fill="#888780"/><path d="M42 82 L60 90 L42 98 Z" fill="#F1EFE8"/><text x="50" y="125" text-anchor="middle" font-size="12" fill="#5F5E5A">Borehole pump</text><text x="50" y="142" text-anchor="middle" font-size="14" fill="#2C2C2A">4.1 m³/h</text><text x="125" y="36" text-anchor="middle" font-size="12" fill="#5F5E5A">Raw tank</text><rect x="95" y="79" width="60" height="56" fill="#B5D4F4"/><rect x="95" y="45" width="60" height="90" rx="4" fill="none" stroke="#888780" stroke-width="1.5"/><text x="125" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">62%</text><rect x="195" y="55" width="40" height="70" rx="18" fill="none" stroke="#888780" stroke-width="1.5"/><text x="215" y="145" text-anchor="middle" font-size="12" fill="#5F5E5A">Sand filter</text><text x="215" y="162" text-anchor="middle" font-size="14" fill="#2C2C